<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>passguard ~/security</title>
<style>
  :root{
    --bg:#070907;
    --panel:#0b0e0b;
    --green:#33ff66;
    --dim:#1f7a38;
    --faint:#14532a;
    --red:#ff5555;
    --amber:#ffb86c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--green);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:15px;line-height:1.7;
    min-height:100vh;display:flex;justify-content:center;
    padding:40px 16px 60px;
    text-shadow:0 0 6px rgba(51,255,102,.35);
  }
  body::after{ /* subtle scanlines */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
  }
  body::before{ /* vignette */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%);
  }
  .term{width:100%;max-width:720px}
  .win{background:var(--panel);border:1px solid var(--faint);border-radius:10px;overflow:hidden;box-shadow:0 0 40px rgba(51,255,102,.07)}
  .titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--faint);background:#0d100d}
  .dot{width:11px;height:11px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .titlebar .t{margin-left:8px;color:var(--dim);font-size:13px}
  .screen{padding:22px 22px 28px;min-height:420px}
  .line{white-space:pre-wrap;word-break:break-word;min-height:1.7em}
  .dim{color:var(--dim)} .faint{color:var(--faint)}
  .ok{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)}
  .prompt{color:var(--green)}
  .prompt .user{color:var(--amber)}
  .cursor{display:inline-block;width:9px;height:17px;background:var(--green);vertical-align:-3px;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px rgba(51,255,102,.8)}
  @keyframes blink{50%{opacity:0}}
  .cmdline{display:flex;align-items:center;gap:8px;margin:6px 0}
  .cmdline input{
    flex:1;min-width:0;background:transparent;border:none;outline:none;
    color:var(--green);font:inherit;caret-color:var(--green);
    text-shadow:0 0 6px rgba(51,255,102,.35);
  }
  .cmdline input::placeholder{color:var(--faint)}
  .bar{letter-spacing:2px}
  .section{margin-top:26px;padding-top:18px;border-top:1px dashed var(--faint)}
  .btnrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{
    font:inherit;background:transparent;color:var(--green);
    border:1px solid var(--dim);border-radius:6px;padding:8px 18px;cursor:pointer;
    text-shadow:0 0 6px rgba(51,255,102,.35);
  }
  button:hover{background:rgba(51,255,102,.1);border-color:var(--green)}
  button:active{transform:translateY(1px)}
  .opts{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-size:14px;color:var(--dim)}
  .opts label{cursor:pointer;display:flex;align-items:center;gap:6px}
  .opts label.on{color:var(--green)}
  .opts input{accent-color:var(--green)}
  input[type=range]{width:100%;accent-color:var(--green);margin:4px 0 6px;background:transparent}
  .genout{
    border:1px solid var(--faint);border-radius:6px;padding:12px 14px;margin:10px 0;
    word-break:break-all;min-height:52px;color:var(--green);background:#080a08;
  }
  .sig{margin-top:26px;color:var(--faint);font-size:13px}
  .sig a{color:var(--dim);text-decoration:none}
  .sig a:hover{color:var(--green)}
  .hidden{display:none}
  @media(max-width:560px){body{font-size:13.5px;padding:24px 10px 40px}.screen{padding:16px}}
</style>
</head>
<body>
<div class="term">
  <div class="win">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="t">root@passguard: ~/security</span>
    </div>
    <div class="screen" id="screen">
      <div id="boot"></div>

      <div class="section" id="sec-check" style="border-top:none;margin-top:8px;padding-top:0">
        <div class="line"><span class="prompt"><span class="user">root@passguard</span>:~$</span> <span id="typed-cmd"></span><span class="cursor" id="cmd-cursor"></span></div>
        <div id="analysis" class="hidden">
          <div class="cmdline">
            <span class="prompt">&gt;</span>
            <input type="password" id="pwd" placeholder="type password to analyze..." autocomplete="off" spellcheck="false">
          </div>
          <div id="results"></div>
        </div>
      </div>

      <div class="section hidden" id="sec-gen">
        <div class="line"><span class="prompt"><span class="user">root@passguard</span>:~$</span> generate --secure</div>
        <div class="line dim">length: <span class="ok" id="lenVal">16</span> <input type="range" id="len" min="8" max="64" value="16" style="width:180px;vertical-align:middle"></div>
        <div class="opts" id="toggles">
          <label class="on"><input type="checkbox" id="oLower" checked> [a-z]</label>
          <label class="on"><input type="checkbox" id="oUpper" checked> [A-Z]</label>
          <label class="on"><input type="checkbox" id="oDigit" checked> [0-9]</label>
          <label class="on"><input type="checkbox" id="oSym" checked> [symbols]</label>
        </div>
        <div class="genout" id="genOut">press [GENERATE]...</div>
        <div class="btnrow">
          <button id="genBtn">[ GENERATE ]</button>
          <button id="copyBtn">[ COPY ]</button>
        </div>
      </div>

      <div class="sig">passguard v1.0 &mdash; 100% client-side &middot; nothing leaves this terminal &middot; built by <a href="https://github.com/ayeshajaved123">ayesha</a></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var boot=document.getElementById('boot'),
      typedCmd=document.getElementById('typed-cmd'),
      cmdCursor=document.getElementById('cmd-cursor'),
      analysis=document.getElementById('analysis'),
      secGen=document.getElementById('sec-gen'),
      results=document.getElementById('results'),
      pwd=document.getElementById('pwd');

  function line(html,cls){
    var d=document.createElement('div');
    d.className='line '+(cls||'');
    d.innerHTML=html;
    boot.appendChild(d);
    return d;
  }
  function typeInto(el,text,speed,done){
    var i=0;
    (function tick(){
      el.textContent=text.slice(0,++i);
      if(i<text.length)setTimeout(tick,speed);
      else if(done)done();
    })();
  }

  var bootLines=[
    ['<span class="dim">[+]</span> loading crypto module ............ <span class="ok">OK</span>',300],
    ['<span class="dim">[+]</span> loading entropy engine ........... <span class="ok">OK</span>',300],
    ['<span class="dim">[+]</span> secure session established',500],
    ['<span class="faint">-- password strength analyzer ready --</span>',400]
  ];
  var bi=0;
  (function nextBoot(){
    if(bi<bootLines.length){
      line(bootLines[bi][0]);
      setTimeout(nextBoot,bootLines[bi][1]);bi++;
    }else{
      typeInto(typedCmd,'analyze --password',45,function(){
        cmdCursor.style.display='none';
        analysis.classList.remove('hidden');
        secGen.classList.remove('hidden');
        pwd.focus();
      });
    }
  })();

  function entropy(p){
    var pool=0;
    if(/[a-z]/.test(p))pool+=26;
    if(/[A-Z]/.test(p))pool+=26;
    if(/[0-9]/.test(p))pool+=10;
    if(/[^a-zA-Z0-9]/.test(p))pool+=33;
    return pool?p.length*Math.log2(pool):0;
  }
  function crackTime(e){
    var s=Math.pow(2,e)/1e10;
    if(s<1)return 'less than a second';
    var u=[[31536000,'year'],[2592000,'month'],[86400,'day'],[3600,'hour'],[60,'minute']];
    for(var i=0;i<u.length;i++)if(s>=u[i][0]){var v=Math.floor(s/u[i][0]);return v.toLocaleString()+' '+u[i][1]+(v>1?'s':'');}
    return Math.floor(s)+' seconds';
  }
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  var timer=null;
  pwd.addEventListener('input',function(){
    clearTimeout(timer);
    timer=setTimeout(function(){scan(pwd.value);},450);
  });

  function scan(p){
    results.innerHTML='';
    if(!p)return;
    var checks=[
      ['len',p.length>=12,'length >= 12 ('+p.length+' chars)'],
      ['lower',/[a-z]/.test(p),'lowercase [a-z]'],
      ['upper',/[A-Z]/.test(p),'uppercase [A-Z]'],
      ['digit',/[0-9]/.test(p),'digits [0-9]'],
      ['sym',/[^a-zA-Z0-9]/.test(p),'symbols']
    ];
    var seq=[['<span class="dim">[*]</span> scanning character sets...',150]];
    checks.forEach(function(c){
      seq.push(['&nbsp;&nbsp;'+(c[1]?'<span class="ok">[+]</span> ':'<span class="faint">[ ]</span> ')+esc(c[2]),120]);
    });
    var e=entropy(p),lvl=e<40?0:e<60?1:e<80?2:3,
        words=['WEAK','FAIR','GOOD','STRONG'],cls=['bad','warn','warn','ok'],
        filled=Math.round((lvl+1)*2.5),bar='';
    for(var i=0;i<10;i++)bar+=i<filled?'\u2588':'\u2591';
    seq.push(['<span class="dim">[*]</span> entropy: <span class="ok">'+e.toFixed(1)+' bits</span>',150]);
    seq.push(['<span class="dim">[*]</span> brute-force time: <span class="ok">'+crackTime(e)+'</span>',150]);
    seq.push(['<span class="dim">STRENGTH:</span> <span class="bar '+cls[lvl]+'">'+bar+'</span> <span class="'+cls[lvl]+'">'+words[lvl]+'</span>',0]);
    var si=0;
    (function next(){
      if(si<seq.length){
        var d=document.createElement('div');d.className='line';d.innerHTML=seq[si][0];
        results.appendChild(d);
        si++;setTimeout(next,seq[si-1][1]);
      }
    })();
  }

  var len=document.getElementById('len'),lenVal=document.getElementById('lenVal'),genOut=document.getElementById('genOut');
  len.addEventListener('input',function(){lenVal.textContent=len.value;});
  document.getElementById('toggles').addEventListener('change',function(ev){
    var t=ev.target.closest('label');if(t)t.classList.toggle('on',ev.target.checked);
  });
  function gen(){
    var L=+len.value,pool='';
    if(document.getElementById('oLower').checked)pool+='abcdefghijklmnopqrstuvwxyz';
    if(document.getElementById('oUpper').checked)pool+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    if(document.getElementById('oDigit').checked)pool+='0123456789';
    if(document.getElementById('oSym').checked)pool+='!@#$%^&*()-_=+[]{};:,.<>?';
    if(!pool){genOut.textContent='ERR: select at least one character set.';return;}
    var arr=new Uint32Array(L),out='';
    crypto.getRandomValues(arr);
    for(var i=0;i<L;i++)out+=pool[arr[i]%pool.length];
    genOut.textContent='';
    var j=0;
    (function tick(){
      genOut.textContent=out.slice(0,++j);
      if(j<out.length)setTimeout(tick,18);
    })();
  }
  document.getElementById('genBtn').addEventListener('click',gen);
  document.getElementById('copyBtn').addEventListener('click',function(){
    var t=genOut.textContent;
    if(!t||t.indexOf('press')===0||t.indexOf('ERR')===0)return;
    navigator.clipboard.writeText(t);
    var b=this;b.textContent='[ COPIED ]';
    setTimeout(function(){b.textContent='[ COPY ]';},1500);
  });
})();
</script>
</body>
</html>
